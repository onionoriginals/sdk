name: Release

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # create tags / push the Version Packages PR branch
  pull-requests: write  # open & update the Version Packages PR
  id-token: write       # npm provenance

jobs:
  # Maintain the "Version Packages" PR. While changesets are pending on main this
  # job opens/updates that PR (versions + CHANGELOGs) and comments the publish
  # plan on it. That PR is the SINGLE approval surface for a release: merging it
  # publishes. No publishing happens here.
  version:
    name: Version (open release PR)
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use a PAT (or GitHub App token) when available so the Version PR's
          # branch push is NOT made with GITHUB_TOKEN — pushes by GITHUB_TOKEN do
          # not trigger workflows, which is why the Version PR otherwise gets no
          # CI. Falls back to GITHUB_TOKEN if CHANGESETS_TOKEN isn't configured
          # (PR still opens; it just won't run ci.yml until the secret is added).
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          # No publish here — the publish job below runs once this PR merges.
          publish: ""
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      # Merging the Version PR IS the release approval, so the PR must state what
      # merging does. changesets' own body lists changelogs but never the target
      # versions' dist-tags — and the surprising one (a brand-new package skipping
      # `next` for `latest`) is invisible without this.
      - name: Comment the publish plan on the Version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        # Commentary must never fail the release workflow: a gh/registry blip here
        # would otherwise redden main for a run that published nothing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Look the PR up before fetching: with no PR there is nothing to comment
          # on and the branch may not exist yet (changesets no-ops on empty changesets).
          pr=$(gh pr list --head changeset-release/main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "no open Version PR — nothing to comment on"; exit 0; fi
          git fetch --no-tags origin changeset-release/main
          # On failure say so on the PR rather than leaving the previous push's
          # now-stale table standing as if it still described the merge.
          if ! node scripts/publish-plan.mjs FETCH_HEAD > /tmp/plan.md 2>/tmp/plan.err; then
            cat /tmp/plan.err
            {
              printf '%s\n\n' '<!-- publish-plan -->' '## What merging this PR publishes' \
                '⚠️ The publish plan could not be generated for this push — do not rely on an earlier plan.'
              printf '```\n%s\n```\n' "$(tail -c 2000 /tmp/plan.err)"
            } > /tmp/plan.md
          fi
          # Upsert by marker so repeated pushes edit one comment instead of piling up.
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
                 --jq 'map(select(.body | startswith("<!-- publish-plan -->"))) | .[0].id // empty' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@/tmp/plan.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@/tmp/plan.md >/dev/null
          fi

  # Decide whether there is actually a new version to publish. `hasChangesets ==
  # false` is true both after the Version PR merges (a real release) AND on any
  # changeset-less push to main (docs/CI, or the first push after enabling this
  # workflow). We only proceed when a package's local version is not yet on the
  # registry — i.e. a genuine pending release. This is what keeps "merge the
  # Version PR" the only trigger: an ordinary push to main never reaches publish.
  check-publish:
    name: Check for unpublished versions
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    outputs:
      shouldPublish: ${{ steps.check.outputs.should }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.10.0"

      - name: Compare local versions against the registry
        id: check
        run: |
          should=false
          for dir in packages/cel packages/sdk packages/auth; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            set +e
            out=$(npm view "$name@$ver" version 2>err.txt)
            code=$?
            set -e
            if [ "$out" = "$ver" ]; then
              echo "$name@$ver already on registry — skip"
            elif [ "$code" -ne 0 ] && grep -qiE "E404|code E404|not found|is not in this registry" err.txt; then
              # Genuine "version does not exist yet" → a real pending release.
              echo "$name@$ver NOT on registry — publish needed"
              should=true
            else
              # Any other non-zero (network/registry/DNS/rate-limit) must NOT be
              # mistaken for "unpublished" — fail loudly rather than over-publish.
              echo "npm view failed for $name@$ver (exit $code) — treating as an error, not a release:"
              cat err.txt
              exit 1
            fi
          done
          echo "should=$should" >> "$GITHUB_OUTPUT"

  # Publish. Runs only for a genuine pending release (Version PR merged and a
  # version is not yet on npm).
  #
  # Deliberately NOT bound to the `npm-publish` Environment. That environment's
  # required reviewer was a SECOND approval for a decision already made by
  # merging the Version PR — invisible from the PR, so a merged release would sit
  # unpublished with nothing on the PR saying so. The PR is the gate now; the
  # automated gates below (Node-ESM + browser-safety) still block a bad build.
  publish:
    name: Publish to npm
    needs: [version, check-publish]
    if: needs.check-publish.outputs.shouldPublish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install

      # The ONLY build before publish. The packages deliberately have no
      # `prepublishOnly`: `changeset publish` runs packages concurrently, so a
      # per-package rebuild had sdk's tsc rewriting dist/*.d.ts while auth's tsc
      # was reading them (auth imports @originals/sdk) — a race that also rebuilt
      # artifacts *after* the ESM gate below had verified them. Turbo builds in
      # dependency order, once.
      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.10.0"
          registry-url: "https://registry.npmjs.org"

      # Hard gate: never publish a dist npm consumers cannot import under Node ESM.
      - name: Verify built packages import under Node ESM
        run: node scripts/verify-esm.mjs

      # Same idea for non-Node consumers: never publish a dist that a browser or
      # edge runtime cannot import because a Node builtin is pulled in eagerly.
      - name: Verify browser-facing entry points have no eager Node builtins
        run: node scripts/check-browser-safety.mjs

      # Publish via changesets/action so npm publish, git tag creation/push, and
      # GitHub Release creation happen as one managed step — avoiding the
      # publish-succeeds-but-tag-push-fails gap where tags would be missing
      # permanently (check-publish would then see the version on npm and never
      # re-enter this job). `changeset publish` is idempotent: already-published
      # versions are skipped.
      - name: Publish to npm, push tags, and create GitHub releases
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `--provenance` is not a valid `changeset publish` flag; npm provenance
          # is enabled via this env var instead (id-token: write is already set).
          NPM_CONFIG_PROVENANCE: "true"
