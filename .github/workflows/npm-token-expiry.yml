name: NPM token expiry guard

# Warns ahead of the ~90-day NPM_TOKEN deadline. The token is a write-capable
# npm granular access token capped at 90 days; when it lapses the release fails
# with a misleading E404 (see docs/RELEASE_TOKEN_ROTATION.md). GitHub secret
# metadata does not expose npm's expiry, so a human records it in the non-secret
# repository variable NPM_TOKEN_EXPIRES_AT when they rotate, and this job nags
# before that date arrives. It reads no secret and cannot publish.

on:
  schedule:
    # Weekly, Monday 08:00 UTC. Fourteen days of weekly nags before the deadline.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-expiry:
    name: Warn if NPM_TOKEN is near expiry
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN_EXPIRES_AT and open or update a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXPIRES_AT: ${{ vars.NPM_TOKEN_EXPIRES_AT }}
          # Days-before-expiry at which this job starts failing and nagging.
          WARN_WITHIN_DAYS: "14"
        run: |
          set -euo pipefail

          TITLE="NPM_TOKEN expiry guard: rotate the npm publish token"

          # Decide health FIRST, so the tracking issue reports the CURRENT recorded
          # expiry. Baking a fixed date into this file would go stale the first
          # time the token is rotated, which is exactly the failure this guard
          # exists to prevent.
          fail=false
          reason=""
          if [ -z "${EXPIRES_AT:-}" ]; then
            fail=true
            reason="\`NPM_TOKEN_EXPIRES_AT\` is not set. Set it when you rotate the token so this guard can warn before the next expiry."
          elif ! exp=$(date -u -d "$EXPIRES_AT" +%s 2>/dev/null); then
            fail=true
            reason="\`NPM_TOKEN_EXPIRES_AT\` (\`$EXPIRES_AT\`) is not a date GNU date can parse. Use an ISO date such as 2026-10-25."
          else
            now=$(date -u +%s)
            days=$(( (exp - now) / 86400 ))
            if [ "$days" -lt 0 ]; then
              fail=true
              reason="\`NPM_TOKEN\` expired ${days#-} day(s) ago (\`NPM_TOKEN_EXPIRES_AT=$EXPIRES_AT\`). The next release will fail with the misleading E404 until it is rotated."
            elif [ "$days" -le "$WARN_WITHIN_DAYS" ]; then
              fail=true
              reason="\`NPM_TOKEN\` expires in $days day(s) (\`NPM_TOKEN_EXPIRES_AT=$EXPIRES_AT\`), within the ${WARN_WITHIN_DAYS}-day warning window. Rotate it before the next release."
            else
              reason="\`NPM_TOKEN\` is healthy: $days day(s) until $EXPIRES_AT (warns within ${WARN_WITHIN_DAYS} days)."
            fi
          fi

          # Build the tracking-issue body: the live status line above (which
          # carries whatever expiry is recorded right now), then the evergreen
          # rotation checklist. No hardcoded deadline.
          printf '%s\n\n' "$reason" > /tmp/token-issue-body.md
          cat >> /tmp/token-issue-body.md <<'BODY'
          The `NPM_TOKEN` used by `.github/workflows/release.yml` is a write-capable
          npm granular access token, which npm caps at a 90-day lifetime. When it
          lapses the release fails with a misleading `E404 Not Found - PUT
          https://registry.npmjs.org/@originals%2fsdk` (npm hides package existence
          on an unauthorized write, and provenance signing succeeds first), so it
          reads as a registry outage rather than a dead credential.

          Only a human with the npm account and its 2FA can rotate it. Rotation
          checklist (full runbook: `docs/RELEASE_TOKEN_ROTATION.md`):

          1. npmjs.com -> Access Tokens -> Generate New Token -> **Granular Access Token**.
          2. **Expiration**: at most **90 days** (do not accept npm's short UI default).
          3. **Packages and scopes**: the **`@originals`** scope, permission **Read and write**.
          4. **Bypass 2FA**: enabled (without it CI publishing fails with `EOTP`).
          5. `gh secret set NPM_TOKEN --repo onionoriginals/sdk`.
          6. Record the new expiry so this guard resets:
             `gh variable set NPM_TOKEN_EXPIRES_AT --repo onionoriginals/sdk --body <ISO date>`.

          This issue is opened, refreshed, and closed automatically by the `NPM
          token expiry guard` workflow. It closes itself once `NPM_TOKEN_EXPIRES_AT`
          is set to a date more than 14 days out, and reopens if the token nears
          expiry again.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY

          # Reuse one canonical tracker across rotations. Match the exact title in
          # ANY state, newest first: a tracker this guard auto-closed after a
          # rotation is REOPENED next time rather than duplicated, so old cycles
          # never pile up closed copies.
          existing_line=$(gh issue list --repo "$REPO" --state all --limit 100 \
            --json number,title,state \
            --jq "map(select(.title == \"$TITLE\")) | sort_by(.number) | last | if . == null then \"\" else \"\(.number) \(.state)\" end")
          existing_num=$(printf '%s' "$existing_line" | awk '{print $1}')
          existing_state=$(printf '%s' "$existing_line" | awk '{print $2}' | tr '[:upper:]' '[:lower:]')

          if [ "$fail" = "true" ]; then
            echo "::warning title=NPM_TOKEN needs rotation::$reason"
            if [ -n "$existing_num" ]; then
              if [ "$existing_state" = "closed" ]; then
                echo "Reopening tracking issue #$existing_num"
                gh issue reopen "$existing_num" --repo "$REPO" >/dev/null
              fi
              echo "Refreshing tracking issue #$existing_num"
              gh issue edit "$existing_num" --repo "$REPO" --body-file /tmp/token-issue-body.md >/dev/null
              url="https://github.com/$REPO/issues/$existing_num"
            else
              echo "Opening a new tracking issue"
              url=$(gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/token-issue-body.md)
            fi
            echo "::error title=NPM_TOKEN expiry guard::$reason See $url and docs/RELEASE_TOKEN_ROTATION.md."
            exit 1
          fi

          echo "$reason"
          if [ -n "$existing_num" ] && [ "$existing_state" = "open" ]; then
            echo "Closing tracking issue #$existing_num now that the token has been rotated."
            gh issue close "$existing_num" --repo "$REPO" \
              --comment "$reason Closing automatically; the guard reopens this if the token nears expiry again." >/dev/null
          fi
