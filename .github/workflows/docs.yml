name: Deploy API Docs

on:
  push:
    branches:
      - main
    paths:
      - 'packages/sdk/src/**'
      - 'packages/sdk/typedoc.json'
      # The docs build compiles this too — see the build step below.
      - 'packages/vh/src/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'
      # The code viewer is part of the same Pages site (pages.yml).
      - 'packages/code/src/**'
      - 'packages/code/viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The Pages site (API docs at /, the code viewer at /code/) is assembled and
# deployed by pages.yml: one deployment replaces the whole site.
jobs:
  pages:
    name: Build and deploy the Pages site
    uses: ./.github/workflows/pages.yml
