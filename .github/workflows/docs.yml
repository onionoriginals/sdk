name: Deploy API Docs

# The Pages site is deployed on every push to main by
# originals-code-dogfood.yml (through pages.yml). This runs it by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The Pages site (API docs at /, the code viewer at /code/) is assembled and
# deployed by pages.yml: one deployment replaces the whole site.
jobs:
  pages:
    name: Build and deploy the Pages site
    uses: ./.github/workflows/pages.yml
