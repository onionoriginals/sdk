name: Deploy API Docs

on:
  push:
    branches:
      - main
    paths:
      - 'packages/sdk/src/**'
      - 'packages/sdk/typedoc.json'
      # The docs build now compiles this too — see the build step below.
      - 'packages/cel/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install

      # typedoc typechecks packages/sdk/src, which imports @originals/cel.
      # That workspace package resolves through its package.json `exports`,
      # which points at ./dist — so with nothing built, every one of those
      # imports is TS2307 "cannot find module" and typedoc exits 3. Build the
      # workspace packages first, exactly as the ESM job in ci.yml does.
      - name: Build workspace packages
        run: bun run build

      - name: Generate API docs
        run: cd packages/sdk && bunx typedoc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api-reference

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
