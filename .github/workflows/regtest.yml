name: Regtest creator journey
on:
  pull_request:
    paths: ['packages/**', 'apps/landing/**', 'scripts/regtest/**', 'package.json', 'bun.lock', '.github/workflows/regtest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run regtest
        env:
          REGTEST_RECEIPT: regtest-receipt.json
          REGTEST_LOGS_DIR: regtest-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regtest-receipt
          path: |
            regtest-receipt-*.json
            regtest-logs/**
