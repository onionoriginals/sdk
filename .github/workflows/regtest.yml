name: Regtest creator journey
on:
  pull_request:
    paths: ['packages/**', 'apps/landing/**', 'scripts/regtest/**', 'package.json', 'bun.lock', '.github/workflows/regtest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # The pinned Core and ord archives (scripts/regtest/install.ts), verified by digest on every use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/originals-regtest
          key: regtest-tools-${{ runner.os }}-${{ hashFiles('scripts/regtest/install.ts') }}
      # Run without the root SDK preload, which requires built workspace packages.
      - run: bun test download.test.ts environment.test.ts assert-stopped.test.ts
        working-directory: scripts/regtest
      - run: bun run regtest
        env:
          REGTEST_RECEIPT: regtest-receipt.json
          REGTEST_LOGS_DIR: regtest-logs
      - run: bun run --cwd apps/landing playwright-core install --with-deps chromium
      - run: bun run regtest:browser
        env:
          REGTEST_BROWSER_ARTIFACTS_DIR: regtest-browser-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regtest-receipt
          path: |
            regtest-receipt-*.json
            regtest-logs/**
            regtest-browser-artifacts/**
